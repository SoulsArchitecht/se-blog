<div class="vote-buttons" [class.vertical]="orientation() === 'vertical'">
  <button 
    (click)="vote('LIKE')" 
    [class.active]="isLiked()"
    [disabled]="isVoting() || !authService.isAuthenticated()"
    class="btn-vote btn-like"
    type="button"
    title="Лайк"
  >
    <span class="vote-icon">👍</span>
    @if (showCounts()) {
      <span class="vote-count">{{ currentStats()?.likesCount ?? 0 }}</span>
    }
  </button>
  
  <button 
    (click)="vote('DISLIKE')" 
    [class.active]="isDisliked()"
    [disabled]="isVoting() || !authService.isAuthenticated()"
    class="btn-vote btn-dislike"
    type="button"
    title="Дизлайк"
  >
    <span class="vote-icon">👎</span>
    @if (showCounts()) {
      <span class="vote-count">{{ currentStats()?.dislikesCount ?? 0 }}</span>
    }
  </button>
</div>

@if (!authService.isAuthenticated() && showLoginHint()) {
  <p class="vote-hint">
    <a routerLink="/login">Войдите</a>, чтобы проголосовать
  </p>
}
