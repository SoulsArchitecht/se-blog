<div class="login-container">
  <div class="login-card">
    <h2>Вход в se.blog</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control">
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <div class="error">Введите корректный email</div>
        }
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" formControlName="password" class="form-control">
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <div class="error">Пароль обязателен</div>
        }
      </div>

      <!-- Submit -->
      @if (!loading) {
        <button type="submit" [disabled]="form.invalid" class="btn btn-primary">
          Войти
        </button>
      } @else {
        <div class="loading"><div class="spinner"></div></div>
      }

      <!-- Error -->
      @if (error) {
        <div class="error-message">{{ error }}</div>
      }
    </form>

    <div class="links">
      <a routerLink="/register">Нет аккаунта? Зарегистрироваться</a>
    </div>
  </div>
</div>
