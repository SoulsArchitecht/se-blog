<aside class="sidebar">
  <!-- Категории -->
  <div class="sidebar-section">
    <h3 class="section-title">Категории</h3>
    
    @if (isLoading()) {
      <div class="loading-state">
        <div class="spinner"></div>
        <span>Загрузка категорий...</span>
      </div>
    } @else {
      <nav class="category-list">
        <!-- Все посты -->
        <a 
          routerLink="/" 
          routerLinkActive="active" 
          [routerLinkActiveOptions]="{ exact: true }"
          class="category-item"
        >
          <span class="category-icon">📋</span>
          <span class="category-name">Все посты</span>
        </a>
        
        <!-- Категории из БД -->
        @for (type of postTypes(); track type.id) {
          <a 
            [routerLink]="['/type', type.slug]" 
            routerLinkActive="active"
            class="category-item"
            [style.borderLeftColor]="type.colorHex"
          >
            <span 
              class="category-icon-badge"
              [style.backgroundColor]="type.colorHex"
              [style.color]="type.colorHex | contrastColor"
            >
              {{ type.icon | categoryIcon }}
            </span>
            <span class="category-name">{{ type.name }}</span>
          </a>
        }
      </nav>
    }
  </div>

  <!-- Личный кабинет (только для авторизованных) -->
  @if (isAuthenticated) {
    <div class="sidebar-section">
      <h3 class="section-title">Личный кабинет</h3>
      <nav class="user-menu">
        <!-- <a routerLink="/my-posts" routerLinkActive="active" class="menu-item">
          <span class="menu-icon"></span>
          <span>Мои посты</span>
        </a>
        <a routerLink="/favorites" routerLinkActive="active" class="menu-item">
          <span class="menu-icon">⭐</span>
          <span>Избранное</span>
        </a>
        <a routerLink="/settings" routerLinkActive="active" class="menu-item">
          <span class="menu-icon">⚙️</span>
          <span>Настройки</span>
        </a> -->
      </nav>
    </div>
  }
</aside>
