# docker-compose.yml
version: '3.8'

services:
  # === Backend ===
  backend-seblog:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/seblog
      SPRING_DATASOURCE_USERNAME: seblog
      SPRING_DATASOURCE_PASSWORD: seblogpass
    depends_on:
      - db
      - elasticsearch
    networks:
      - blog-network

  # === Frontend ===
  frontend-seblog:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend-seblog
    networks:
      - blog-network

  # === PostgreSQL ===
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: seblog
      POSTGRES_USER: seblog
      POSTGRES_PASSWORD: seblogpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_/var/lib/postgresql/data
    networks:
      - blog-network

  # === Elasticsearch ===
  elasticsearch:
    image: elasticsearch:8.11.3
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - blog-network

  # === Kibana ===
  kibana:
    image: kibana:8.11.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - blog-network

  # === Prometheus ===
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker-compose-config/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - blog-network

  # === Grafana ===
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - blog-network

  # === Jenkins (CI/CD) ===
  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    networks:
      - blog-network

volumes:
  postgres_
  jenkins_home:
  grafana_

networks:
  blog-network:
    driver: bridge