<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>SE Blog - Платформа для публикации статей</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }
    
    /* Стили для загрузки приложения */
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Убираем отступы у всех элементов */
    h1, h2, h3, h4, h5, h6, p {
      margin: 0;
    }
    
    a {
      text-decoration: none;
      color: inherit;
    }
    
    ul, ol {
      list-style: none;
    }
    
    /* Утилитные классы */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    
    /* Скрываем приложение пока загружается */
    app-root:empty + .app-loading {
      display: flex;
    }
  </style>
</head>
<body>
  <!-- Основной контейнер приложения -->
  <app-root></app-root>
  
  <!-- Состояние загрузки (показывается до загрузки Angular) -->
  <div class="app-loading">
    <div class="loading-spinner"></div>
    <p>Загрузка приложения...</p>
  </div>
</body>
</html>
