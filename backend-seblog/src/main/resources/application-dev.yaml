server:
  port: 8080

# --- Datasource ---
spring:
  datasource:
    url: jdbc:postgresql://db-seblog:5432/seblog
    username: seblog
    password: seblogpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public

# --- Liquibase ---
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

# --- Logging ---
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.sql: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# --- Management (Actuator) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always