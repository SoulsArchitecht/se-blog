databaseChangeLog:
- changeSet:
    id: 0001-31102025-create-user-table
    author: serge
    changes:
      - createTable:
          tableName: users
          columns:
            - column:
                name: id
                type: UUID
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: username
                type: VARCHAR(50)
                constraints:
                  nullable: false
                  unique: true
            - column:
                name: email
                type: VARCHAR(100)
                constraints:
                  nullable: false
                  unique: true
            - column:
                name: password_hash
                type: VARCHAR(255)
                constraints:
                  nullable: false
            - column:
                name: role
                type: VARCHAR(20)
                defaultValue: USER
                constraints:
                  nullable: false
            - column:
                name: status
                type: VARCHAR(20)
                defaultValue: ACTIVE
                constraints:
                  nullable: false
            - column:
                name: created_at
                type: TIMESTAMP
                defaultValueComputed: CURRENT_TIMESTAMP
                constraints:
                  nullable: false