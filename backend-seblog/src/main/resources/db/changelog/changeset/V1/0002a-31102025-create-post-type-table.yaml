databaseChangeLog:
  - changeSet:
      id: 0002a-31102025-create-post-type-table
      author: serge
      changes:
        - createTable:
            tableName: post_types
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: slug
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: color_hex
                  type: VARCHAR(50)
                  defaultValue: "#000000"
                  constraints:
                    nullable: false
              - column:
                  name: icon
                  type: VARCHAR(50)
                  defaultValue: "article"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false